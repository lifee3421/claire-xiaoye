<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100f14">
<title>今日排程</title>
<style>
html,body{margin:0;min-height:100%;background:#100f14;color:#8f8888;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center}.boot{font-size:11px;opacity:.65}.error{max-width:420px;padding:20px;line-height:1.6;color:#d7a3a7}
</style>
</head>
<body>
<div class="boot" id="boot">正在打开今日排程…</div>
<script>
(async()=>{
  const expected='7957481b4a28c6d77169f3b8a644a6fd64d98d15b60bc7e18d01968ab428ce89';
  const urls=Array.from({length:13},(_,i)=>`/today/parts/${String(i).padStart(2,'0')}.txt`);
  try{
    const parts=await Promise.all(urls.map(async url=>{
      const response=await fetch(url,{cache:'no-cache'});
      if(!response.ok)throw new Error(`${url} → ${response.status}`);
      return response.text();
    }));
    const source=parts.join('');
    const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(source)))).map(v=>v.toString(16).padStart(2,'0')).join('');
    if(digest!==expected)throw new Error(`UI source mismatch: ${digest}`);
    document.open();document.write(source);document.close();
  }catch(error){
    document.body.innerHTML=`<div class="error"><b>今日排程 UI 没有通过源码校验。</b><br>${String(error?.message||error)}<br><br>为了避免又显示一个“差不多”的版本，这里不会自动降级。</div>`;
  }
})();
</script>
</body>
</html>
