<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f0e8">
  <title>雪尘早晚流程</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f2f0e8;color:#272720;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:520px;border:1px solid #c9c6ba;background:#f8f6ef;padding:22px;line-height:1.7}.muted{color:#777568;font-size:13px;word-break:break-word}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div class="card"><b>雪尘正在把页面打开。</b><div class="muted">第一次载入会多等一小会儿。</div></div></div>
  <script>
  (async()=>{
    const loading=document.getElementById("loading");
    const bundleUrl=new URL("/xuechen/routine.bundle.bin",location.origin);
    try{
      const res=await fetch(bundleUrl,{cache:"no-store"});
      if(!res.ok) throw new Error(`bundle ${res.status} · ${bundleUrl.pathname}`);
      const bytes=new Uint8Array(await res.arrayBuffer());
      let html="";
      const isGzip=bytes.length>2&&bytes[0]===0x1f&&bytes[1]===0x8b;
      if(isGzip){
        if(typeof DecompressionStream!=="function") throw new Error("当前浏览器不支持 gzip 解压");
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        html=await new Response(stream).text();
      }else{
        html=new TextDecoder("utf-8").decode(bytes);
      }
      if(!html.includes("雪尘")||!html.toLowerCase().includes("<!doctype html")){
        throw new Error(`bundle 内容异常 · ${bytes.length} bytes · ${isGzip?"gzip":"plain"}`);
      }
      document.open();document.write(html);document.close();
    }catch(err){
      loading.innerHTML=`<div class="card"><b>页面没有正确载入。</b><div class="muted">${String(err&&err.message||err)}</div><div class="muted" style="margin-top:8px">bundle: ${bundleUrl.pathname}</div></div>`;
    }
  })();
  </script>
</body>
</html>
