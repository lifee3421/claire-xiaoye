name: One-shot planner apply-template patch

on:
  push:
    branches: [feat/snowdust-planner-autonomy]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snowdust-planner-autonomy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add apply_template to planner apply
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/schedule/plannerPatchApply.js';
          let s = fs.readFileSync(path, 'utf8');

          const importAnchor = 'import { buildPlannerCreatedTask, buildPlannerEditPatch, editedOccupiedDuration, buildPlannerDeletePatch } from "./plannerPatchCardOps.js";';
          if (!s.includes(importAnchor)) throw new Error('import anchor missing');
          if (!s.includes('applySavedDayTemplate')) s = s.replace(importAnchor, `${importAnchor}\nimport { applySavedDayTemplate } from "./plannerTemplateApply.js";`);

          const oldInit = `  const nowDate = now instanceof Date && !Number.isNaN(now.getTime()) ? now : new Date();\n  const nowIso = nowDate.toISOString();\n  const nowMinutes = draft.targetDate === dateForTimezone(nowDate, TIMEZONE) ? minuteForTimezone(nowDate, TIMEZONE) : -Infinity;\n\n  const movableSegments = resolveMovableSegments(draft, settings, { books, readingSessions });\n\n  const liveBlocks = [];`;
          const newInit = `  const nowDate = now instanceof Date && !Number.isNaN(now.getTime()) ? now : new Date();\n  const nowIso = nowDate.toISOString();\n  const nowMinutes = draft.targetDate === dateForTimezone(nowDate, TIMEZONE) ? minuteForTimezone(nowDate, TIMEZONE) : -Infinity;\n\n  // Apply a saved day template first. It is one explicit operation, so Snow can\n  // start from a known routine without re-creating every card in chat. Other\n  // changes in the same patch are then resolved against that materialized day.\n  let workingDraft = draft;\n  const templateCreatedTaskIds = [];\n  let appliedTemplateCount = 0;\n  for (const change of patch.changes) {\n    if (change.type !== "apply_template") continue;\n    const result = applySavedDayTemplate({\n      draft: workingDraft,\n      settings,\n      templateId: change.templateId,\n      scopes: change.scopes || {},\n      now: nowDate,\n    });\n    if (!result.ok) {\n      return { ok: false, reason: "unresolvable_changes", problems: [\`template \"\${change.templateId}\" could not be applied: \${result.reason}\`], rejections: [{ templateId: change.templateId, reason: result.reason }] };\n    }\n    workingDraft = result.nextDraft;\n    templateCreatedTaskIds.push(...(result.createdTaskIds || []));\n    appliedTemplateCount += 1;\n  }\n\n  const movableSegments = resolveMovableSegments(workingDraft, settings, { books, readingSessions });\n\n  const liveBlocks = [];`;
          if (!s.includes(oldInit)) throw new Error('function init anchor missing');
          s = s.replace(oldInit, newInit);

          const forEachAnchor = '  patch.changes.forEach((change, index) => {\n    if (change.type === "move" || change.type === "schedule_from_pool") {';
          const forEachReplacement = '  patch.changes.forEach((change, index) => {\n    if (change.type === "apply_template") return;\n    if (change.type === "move" || change.type === "schedule_from_pool") {';
          if (!s.includes(forEachAnchor)) throw new Error('forEach anchor missing');
          s = s.replace(forEachAnchor, forEachReplacement);

          s = s.replace('(draft.todayCustomBlocks || []).length + trackerBlocks.length + createdTaskCounter', '(workingDraft.todayCustomBlocks || []).length + trackerBlocks.length + createdTaskCounter');
          s = s.replace('(draft.todayCustomBlocks || []).length + trackerTaskCounter', '(workingDraft.todayCustomBlocks || []).length + trackerTaskCounter');
          s = s.replace('validatePatchConflicts({ draft, settings, segments: movableSegments, positions })', 'validatePatchConflicts({ draft: workingDraft, settings, segments: movableSegments, positions })');
          s = s.replace('let nextDraft = mergeTimelineMutationIntoDraft(draft, timelinePatch);', 'let nextDraft = mergeTimelineMutationIntoDraft(workingDraft, timelinePatch);');

          const idsAnchor = '  const changedBlockIds = [\n    ...positions.map((item) => item.id),';
          const idsReplacement = '  const changedBlockIds = [\n    ...templateCreatedTaskIds,\n    ...positions.map((item) => item.id),';
          if (!s.includes(idsAnchor)) throw new Error('changed ids anchor missing');
          s = s.replace(idsAnchor, idsReplacement);

          const summaryAnchor = '  const summaryParts = [];\n  if (movedCount) summaryParts.push(`移动 ${movedCount} 项`);';
          const summaryReplacement = '  const summaryParts = [];\n  if (appliedTemplateCount) summaryParts.push(`套用模板 ${appliedTemplateCount} 个`);\n  if (movedCount) summaryParts.push(`移动 ${movedCount} 项`);';
          if (!s.includes(summaryAnchor)) throw new Error('summary anchor missing');
          s = s.replace(summaryAnchor, summaryReplacement);

          fs.writeFileSync(path, s);
          NODE
      - name: Syntax checks
        run: |
          node --check src/schedule/plannerPatchApply.js
          node --check src/schedule/plannerTemplateApply.js
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/patch-planner-apply-template.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/schedule/plannerPatchApply.js .github/workflows/patch-planner-apply-template.yml
          git commit -m "feat: apply saved templates through planner bridge"
          git push origin HEAD:feat/snowdust-planner-autonomy
