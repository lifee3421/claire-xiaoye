name: Phase2 corrected closure runner
on:
  push:
    branches: [feat/xiaoye-daily-mutation-surface-closure]
permissions:
  contents: write
jobs:
  closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xiaoye-daily-mutation-surface-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Execute corrected closure patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/phase2-planner-inventory.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Patch remaining planner UI surfaces\n        shell: python\n        run: |\n'
          end_marker = '      - name: Run planner surface regressions\n'
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          script = script.replace('instantiateTemplateForDay(current, template, scopes)', 'instantiateTemplateForDay(template, current, scopes)')
          script = script.replace(
            "'          commitDraftChange((current) => ({ ...current, taskPoolOrder: arrayMove(poolOrder, from, to) }), \"已调整任务池顺序\");\\n'",
            "'        commitDraftChange({ taskPoolOrder: arrayMove(currentOrder, fromIndex, toIndex) }, \"已调整今天任务池顺序\");\\n'",
          )
          script = script.replace(
            "'          commitCanonicalDraftChange((current) => ({ ...current, taskPoolOrder: arrayMove(poolOrder, from, to) }), (current, next) => [buildPoolOrderChange(next.taskPoolOrder)], \"已调整任务池顺序\", { prefix: \"pool-order\" });\\n'",
            "'        commitCanonicalDraftChange({ taskPoolOrder: arrayMove(currentOrder, fromIndex, toIndex) }, (current, next) => [buildPoolOrderChange(next.taskPoolOrder)], \"已调整今天任务池顺序\", { prefix: \"pool-order\" });\\n'",
          )
          compile(script, '<phase2-closure-patch>', 'exec')
          exec(script, {'__name__': '__main__'})

          # The inventory patch is itself Python and some JS double-quoted
          # confirmation strings intentionally contain "\\n\\n". When the
          # extracted Python is executed those can become literal newlines,
          # which are illegal inside a JS double-quoted string. Repair only
          # those exact generated copies; product wording/semantics stay the same.
          app_path = Path('src/App.jsx')
          app = app_path.read_text(encoding='utf-8')
          def fix_confirm(prefix, suffix):
              global app
              bad = 'window.confirm("' + prefix + (chr(10) * 2) + suffix + '")'
              good = 'window.confirm("' + prefix + chr(92) + 'n' + chr(92) + 'n' + suffix + '")'
              app = app.replace(bad, good)
          fix_confirm('撤销上一步排程修改？', '撤销会作为一次排程提案确认写入。')
          fix_confirm('恢复刚才撤销的排程修改？', '恢复会作为一次排程提案确认写入。')
          fix_confirm('保存这次当天排程修改？', '确认后会通过排程提案写入，不会直接覆盖云端日程。')
          app_path.write_text(app, encoding='utf-8')
      - name: Run planner surface regressions
        shell: bash
        run: |
          node --experimental-loader ./scripts/testEsmLoader.mjs --test \
            api/planner-mutate.test.js \
            api/planner-direct-edit.test.js \
            api/planner-apply.test.js \
            api/planner-apply-revision-equivalence.test.js \
            api/planner-ledger-revision.test.js \
            api/planner-shared-commit.contract.test.js \
            api/planner-surface-policy.contract.test.js \
            src/schedule/canonicalPlannerUiMutation.test.js \
            src/schedule/plannerDailyCanonicalState.test.js \
            src/schedule/plannerUiSurfaceAdapter.test.js \
            src/schedule/plannerDatePersistence.test.js \
            src/schedule/timelineRescheduleGate.test.js \
            src/schedule/timelineRescheduleGate.returnToPool.test.js \
            src/schedule/timelineRescheduleGate.integration.test.js \
            src/schedule/timelinePositionsPatch.test.js \
            src/utils/plannerInbox.shared.test.js
      - name: Run complete mutation kernel regression
        run: node --experimental-loader ./scripts/testEsmLoader.mjs --test src/schedule/plannerPatchApply.test.js
      - name: Build
        run: pnpm build
      - name: Verify browser schedule bypass is closed
        shell: bash
        run: |
          ! grep -n -E 'payload\.scheduleAssistantDraft(Archive)?\s*=' src/services/dataService.js
          ! grep -n -E 'recurring_rule|canonical.*recurr' src/agent/plannerPatch.js
      - name: Commit verified business closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- src/schedule/plannerPatchApply.test.js
          git add \
            src/App.jsx \
            src/agent/buildPlannerContext.js \
            src/schedule/plannerPatchApply.js \
            src/schedule/timelineRescheduleGate.js \
            src/services/dataService.js \
            src/schedule/plannerDailyCanonicalState.test.js \
            src/schedule/plannerUiSurfaceAdapter.test.js \
            api/planner-surface-policy.contract.test.js
          git commit -m "feat(planner): close Xiaoye daily mutation surfaces"
          git push origin HEAD:feat/xiaoye-daily-mutation-surface-closure
