name: Patch planner daily state and nap

on:
  push:
    branches:
      - fix/planner-daily-state-nap-targets

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic patch
        run: node scripts/patch-planner-daily-state-nap-targets.mjs
      - name: Targeted planner regressions
        run: >-
          node --experimental-loader ./scripts/testEsmLoader.mjs --test
          src/agent/plannerNapReminder.test.js
          src/server/plannerLifeCardCompletion.test.js
          src/schedule/studyTargetResolver.dailyDefault.test.js
          src/schedule/plannerDailyLifeCards.contract.test.js
          src/utils/timelineCardEdit.category.test.js
      - name: Production build
        run: pnpm build
      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/agent/buildReminderPlan.js
          git commit -m "fix: reset planner day promptly and add nap wake reminders"
          git push
