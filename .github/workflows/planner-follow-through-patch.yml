name: Planner follow-through patch

on:
  push:
    branches:
      - fix/planner-follow-through

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planner-follow-through
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact planner patch
        run: node scripts/patch-planner-follow-through.mjs
      - name: Verify patched source parses in production build
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit patched App
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix(planner): make targets and trackers follow the active plan date [planner-patch-applied]"
          git push origin HEAD:fix/planner-follow-through
