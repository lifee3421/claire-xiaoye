name: One-shot planner autonomy round2 patch

on:
  push:
    branches: [feat/snowdust-planner-autonomy]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snowdust-planner-autonomy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch nap reminders, baseline capture and rules UI
        run: |
          node <<'NODE'
          const fs = require('fs');

          // 1) Nap/dinner reminders.
          {
            const path = 'src/agent/buildReminderPlan.js';
            let s = fs.readFileSync(path, 'utf8');
            s = s.replace(
              'const DEFAULT_ROLES = new Set(["wake_routine", "morning_study", "lunch", "afternoon_study", "evening_study", "daily_review", "wash"]);',
              'const DEFAULT_ROLES = new Set(["wake_routine", "morning_study", "lunch", "dinner", "nap", "afternoon_study", "evening_study", "daily_review", "wash"]);'
            );
            const semanticOld = '  if (/lunch/.test(value)) return "lunch";\n  if (/wash|hygiene/.test(value)) return "wash";';
            const semanticNew = '  if (/lunch/.test(value)) return "lunch";\n  if (/dinner/.test(value)) return "dinner";\n  if (/nap/.test(value) || /午睡|午休/.test(String(card.title || ""))) return "nap";\n  if (/wash|hygiene/.test(value)) return "wash";';
            if (!s.includes(semanticOld)) throw new Error('semantic role anchor missing');
            s = s.replace(semanticOld, semanticNew);
            const purposeOld = 'function defaultPurpose(role, anchor) { if (role === "lunch") return "eat"; if (role === "wash") return "confirm_completion"; return anchor === "end" ? "finish_task" : "start_task"; }';
            const purposeNew = 'function defaultPurpose(role, anchor) { if (role === "lunch" || role === "dinner") return "eat"; if (role === "nap") return "rest"; if (role === "wash") return "confirm_completion"; return anchor === "end" ? "finish_task" : "start_task"; }';
            if (!s.includes(purposeOld)) throw new Error('purpose anchor missing');
            s = s.replace(purposeOld, purposeNew);
            const textOld = 'function defaultText(card, purpose) { return purpose === "eat" ? `该吃饭了：${card.title || "午饭"}` : purpose === "confirm_completion" ? `该洗漱了：${card.title || "洗漱"}` : `开始${card.title || "计划事项"}`; }';
            const textNew = 'function defaultText(card, purpose) { return purpose === "eat" ? `该吃饭了：${card.title || "吃饭"}` : purpose === "rest" ? `该午睡啦：${card.title || "午睡"}` : purpose === "confirm_completion" ? `该洗漱了：${card.title || "洗漱"}` : `开始${card.title || "计划事项"}`; }';
            if (!s.includes(textOld)) throw new Error('text anchor missing');
            s = s.replace(textOld, textNew);
            fs.writeFileSync(path, s);
          }

          // 2) First explicit Snow-dust apply becomes the day's baseline automatically.
          {
            const path = 'src/schedule/plannerPatchApply.js';
            let s = fs.readFileSync(path, 'utf8');
            const importAnchor = 'import { computePlannerContextBaseRevision } from "../agent/buildPlannerContext.js";';
            if (!s.includes(importAnchor)) throw new Error('planner apply import anchor missing');
            s = s.replace(importAnchor, `${importAnchor}\nimport { createBaselinePlanSnapshot, hasBaseline } from "./baselinePlanModel.js";`);
            const anchor = '  const changedBlockIds = [\n';
            if (!s.includes(anchor)) throw new Error('baseline insertion anchor missing');
            const baseline = `  // An applied PlannerProposal is already an explicit confirmation. Capture the\n  // first confirmed Snow-dust-written plan as the day baseline so the user does\n  // not have to reopen the planner just to press “保存初版”. Never overwrite an\n  // existing baseline here.\n  if (!hasBaseline(nextDraft)) {\n    const baselineSegments = resolveMovableSegments(nextDraft, settings, { books, readingSessions });\n    const baselineBlocks = baselineSegments\n      .filter((segment) => segment.placement === "timeline" && Number.isFinite(Number(segment.manualStart)))\n      .map((segment) => buildScheduledTaskBlockFromSegment(segment, { start: Number(segment.manualStart) }))\n      .filter(isLivePlanBlock);\n    nextDraft = {\n      ...nextDraft,\n      baselinePlanSnapshot: createBaselinePlanSnapshot({\n        targetDate: nextDraft.targetDate,\n        confirmedAt: nowIso,\n        targetSnapshot: nextDraft.studyTargetSnapshot || null,\n        blocks: baselineBlocks,\n      }),\n    };\n  }\n\n`;
            s = s.replace(anchor, baseline + anchor);
            fs.writeFileSync(path, s);
          }

          // 3) User-editable Snow-dust planning rules in planner Advanced settings.
          {
            const path = 'src/App.jsx';
            let s = fs.readFileSync(path, 'utf8');
            const anchor = '      <details className="panel wide schedule-collapse prompt-collapse">';
            if (!s.includes(anchor)) throw new Error('planner advanced prompt anchor missing');
            const ui = `      <details className="panel wide schedule-collapse" open>\n        <summary><span><strong>雪尘排程规则</strong><small>雪尘每次排程都会读取；一行一条</small></span><Wand2 size={21} /></summary>\n        <textarea\n          value={Array.isArray(settings.snowdustPlannerRules) ? settings.snowdustPlannerRules.join("\\n") : String(settings.snowdustPlannerRules || "")}\n          onChange={(event) => setSettings((current) => ({ ...current, snowdustPlannerRules: event.target.value.split(/\\r?\\n/).map((item) => item.trim()).filter(Boolean).slice(0, 30) }))}\n          placeholder={"例如：\\n运动后一定安排洗澡\\n午饭后保留午睡\\n两节高强度学习之间至少休息20分钟"}\n          rows={6}\n        />\n        <div className="button-row"><button className="primary-button compact" type="button" onClick={async () => { const ok = await persistPlannerNow("manual", draft, settings); if (ok) setSaveState("雪尘排程规则已保存"); }}>保存排程规则</button></div>\n        <p className="field-help">系统仍会强制保护吃饭、午休、上床边界；这里写的是你自己的长期偏好，雪尘无需每次重新问。</p>\n      </details>\n\n`;
            s = s.replace(anchor, ui + anchor);
            fs.writeFileSync(path, s);
          }
          NODE
      - name: Syntax checks
        run: |
          node --check src/agent/buildReminderPlan.js
          node --check src/schedule/plannerPatchApply.js
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/patch-planner-autonomy-round2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent/buildReminderPlan.js src/schedule/plannerPatchApply.js src/App.jsx .github/workflows/patch-planner-autonomy-round2.yml
          git commit -m "feat: add nap reminders baseline capture and planner rules"
          git push origin HEAD:feat/snowdust-planner-autonomy
