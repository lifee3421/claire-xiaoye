name: Xuechen v30.2 one shot

on:
  push:
    branches:
      - fix/xuechen-v302-ritual-quick-picker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/xuechen-v302-patch.py

      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('public/xuechen/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          Path('/tmp/xuechen-inline.js').write_text('\n'.join(x for x in blocks if x.strip()), encoding='utf-8')
          assert 'quickRitualLauncher' in html
          assert 'QUICK_RITUAL_COMBOS' in html
          assert 'v30.2 · quick ritual combo picker' in html
          PY
          node --check /tmp/xuechen-inline.js
          git diff --check

      - name: Commit generated patch
        run: |
          rm -f .github/workflows/xuechen-v302-one-shot.yml scripts/xuechen-v302-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/xuechen/index.html .github/workflows/xuechen-v302-one-shot.yml scripts/xuechen-v302-patch.py
          git commit -m "fix(xuechen): v30.2 quick ritual picker"
          git push
