name: Today Standalone CI

on:
  push:
    branches:
      - feat/today-standalone-client
      - integration/newworld-planner-bridge
  workflow_dispatch:

# The frozen standalone Today source and its narrow New World compatibility
# bridge must both keep the full repository test suite and Vite build green.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
