name: Today Standalone CI

on:
  push:
    branches:
      - feat/today-standalone-client
  workflow_dispatch:

# This branch is the full-edit standalone Today candidate. Keep both the
# repository test suite and Vite standalone build green before Preview use.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build