name: New World Planner Bridge CI

on:
  push:
    branches:
      - integration/newworld-planner-bridge
  pull_request:
    branches:
      - feat/today-standalone-client
  workflow_dispatch:

# Validation-only gate for the narrow New World compatibility bridge. The
# frozen feat/today-standalone-client line keeps its own CI unchanged; this
# branch must prove the bridge contract and production build without turning
# an unrelated long-running repository suite into a cutover blocker.
jobs:
  verify-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify signed Planner bridge contract
        run: node --experimental-loader ./scripts/testEsmLoader.mjs --test src/server/newWorldPlannerBridgeEndpoint.test.js

      - name: Build
        run: pnpm build
