name: Phase2 workflow anchor fix
on:
  push:
    branches: [feat/xiaoye-daily-mutation-surface-closure]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xiaoye-daily-mutation-surface-closure
          fetch-depth: 0
      - name: Correct template anchor without changing product code
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/phase2-planner-inventory.yml')
          text = p.read_text(encoding='utf-8')
          old_expected = '    commitDraftChange((current) => instantiateTemplateForDay(current, template, scopes), `已应用模板「${template.name}」`);\\n'
          new_expected = '    commitDraftChange((current) => instantiateTemplateForDay(template, current, scopes), `已应用模板「${template.name}」`);\\n'
          old_replacement = '    commitProposalDraftChange((current) => instantiateTemplateForDay(current, template, scopes), `应用模板「${template.name}」`, { confirmed: true, prefix: "template" });\\n'
          new_replacement = '    commitProposalDraftChange((current) => instantiateTemplateForDay(template, current, scopes), `应用模板「${template.name}」`, { confirmed: true, prefix: "template" });\\n'
          if text.count(old_expected) != 1 or text.count(old_replacement) != 1:
              raise SystemExit('template anchor text was not uniquely found')
          p.write_text(text.replace(old_expected, new_expected, 1).replace(old_replacement, new_replacement, 1), encoding='utf-8')
      - name: Commit corrected closure workflow and self-delete
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2-workflow-anchor-fix.yml
          git add .github/workflows/phase2-planner-inventory.yml
          git commit -m "chore: fix Phase 2 template patch anchor"
          git push origin HEAD:feat/xiaoye-daily-mutation-surface-closure
