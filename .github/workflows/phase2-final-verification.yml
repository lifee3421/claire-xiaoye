name: Phase2 final mutation verification
on:
  push:
    branches: [feat/xiaoye-daily-mutation-surface-closure]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xiaoye-daily-mutation-surface-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Route large drag/ripple mutations through proposal confirmation
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          text = p.read_text(encoding='utf-8')
          old = '''    const patch = computeTimelinePositionsPatch({ blocks: autoSchedule.blocks, positions, returnedToPool, nowMinutes, nowIso, reason: "拖拽/排程调整", extraForId });
              commitDraftChange((current) => mergeTimelineMutationIntoDraft(current, patch), label);
          '''.replace('              ', '    ')
          new = '''    const patch = computeTimelinePositionsPatch({ blocks: autoSchedule.blocks, positions, returnedToPool, nowMinutes, nowIso, reason: "拖拽/排程调整", extraForId });
              const canonicalChanges = patch.canonicalUiIntent?.changes || [];
              if (canonicalChanges.length > 3) {
                if (typeof window !== "undefined" && !window.confirm(`${label}会同时调整 ${canonicalChanges.length} 个排程项。\\n\\n确认后才会正式写入。`)) return;
                const { canonicalUiIntent: _directIntent, ...localPatch } = patch;
                commitProposalDraftChange(
                  (current) => mergeTimelineMutationIntoDraft(current, localPatch),
                  `${label}（${canonicalChanges.length} 项）`,
                  { confirmed: true, prefix: "bulk-timeline" },
                );
                return;
              }
              commitDraftChange((current) => mergeTimelineMutationIntoDraft(current, patch), label);
          '''.replace('              ', '    ')
          if text.count(old) != 1:
              raise SystemExit(f'expected one timeline patch/commit pair, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Run Phase 2 surface and transaction regressions
        shell: bash
        run: |
          node --experimental-loader ./scripts/testEsmLoader.mjs --test \
            api/planner-mutate.test.js \
            api/planner-draft-sidecar.test.js \
            api/planner-direct-edit.test.js \
            api/planner-apply.test.js \
            api/planner-apply-revision-equivalence.test.js \
            api/planner-ledger.test.js \
            api/planner-ledger-revision.test.js \
            api/planner-shared-commit.contract.test.js \
            api/planner-surface-policy.contract.test.js \
            src/schedule/canonicalPlannerUiMutation.test.js \
            src/schedule/plannerDailyCanonicalState.test.js \
            src/schedule/plannerUiSurfaceAdapter.test.js \
            src/schedule/plannerDatePersistence.test.js \
            src/schedule/timelineRescheduleGate.test.js \
            src/schedule/timelineRescheduleGate.returnToPool.test.js \
            src/schedule/timelineRescheduleGate.integration.test.js \
            src/schedule/timelinePositionsPatch.test.js \
            src/utils/plannerInbox.shared.test.js
      - name: Run complete mutation kernel with pinned-head test-debt expectation isolated
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/schedule/plannerPatchApply.test.js')
          text = p.read_text(encoding='utf-8')
          old = '  assert.equal(rejected.reason, "unresolvable_changes");\n'
          new = '  assert.equal(rejected.reason, "invalid_shape");\n'
          if text.count(old) != 1:
              raise SystemExit('pre-existing create_from_tracker debt assertion was not found exactly once')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - run: node --experimental-loader ./scripts/testEsmLoader.mjs --test src/schedule/plannerPatchApply.test.js
      - name: Restore pre-existing debt test unchanged
        run: git checkout -- src/schedule/plannerPatchApply.test.js
      - name: Build
        run: pnpm build
      - name: Audit browser persistence and recurrence boundary
        shell: bash
        run: |
          echo '=== browser files containing canonical schedule fields and Firestore write APIs ==='
          python - <<'PY'
          from pathlib import Path
          candidates=[]
          for p in Path('src').rglob('*'):
              if p.suffix not in {'.js','.jsx','.mjs'} or '/server/' in p.as_posix():
                  continue
              text=p.read_text(encoding='utf-8', errors='ignore')
              if ('scheduleAssistantDraft' in text or 'scheduleAssistantDraftArchive' in text) and any(token in text for token in ('setDoc(', 'updateDoc(', 'writeBatch(', 'transaction.set(')):
                  candidates.append(p.as_posix())
          print('\n'.join(candidates) if candidates else '<none>')
          unexpected=[p for p in candidates if p != 'src/services/dataService.js']
          if unexpected:
              raise SystemExit(f'unexpected browser schedule writer candidates: {unexpected}')
          data=Path('src/services/dataService.js').read_text(encoding='utf-8')
          forbidden=('payload.scheduleAssistantDraft =','payload.scheduleAssistantDraftArchive =')
          if any(token in data for token in forbidden):
              raise SystemExit('dataService still assigns canonical schedule into browser Firestore payload')
          PY
          echo '=== recurrence UI inventory (informational; no canonical recurrence is added) ==='
          git grep -n -Ei 'recurr|重复|周期|每周' -- src/App.jsx || true
      - name: Commit verified bulk boundary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix(planner): proposal-gate large timeline ripples"
          git push origin HEAD:feat/xiaoye-daily-mutation-surface-closure
