name: Planner hydration date-scope patch

on:
  push:
    branches:
      - fix/planner-hydration-date-scope

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[hydration-patched]') && !contains(github.event.head_commit.message, '[hydration-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planner-hydration-date-scope
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-planner-hydration-date-scope.mjs
      - name: Build
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit patched App
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix: keep planner hydration on Today [hydration-patched]"
          git push origin HEAD:fix/planner-hydration-date-scope
