name: Shared ledger UI patch

on:
  push:
    branches:
      - feat/shared-planner-ledger

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ui-patched]') && !contains(github.event.head_commit.message, '[ui-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-planner-ledger
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply precise UI patch
        run: node scripts/patch-shared-ledger-ui.mjs
      - name: Verify App parses through production build
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit patched App
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "feat: surface shared planner ledger UI [ui-patched]"
          git push origin HEAD:feat/shared-planner-ledger
