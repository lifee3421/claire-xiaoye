name: Reward feature CI

on:
  push:
    branches:
      - feature/reward-challenges-surprise
  pull_request:
    branches:
      - main

jobs:
  reward-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reward domain tests
        run: pnpm test
      - name: Production build
        run: pnpm build
