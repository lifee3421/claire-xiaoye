name: Reward feature CI

on:
  push:
    branches:
      - feature/reward-challenges-surprise
  pull_request:
    branches:
      - main

jobs:
  reward-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reward feature contract and domain tests
        run: >-
          node --experimental-loader ./scripts/testEsmLoader.mjs --test
          src/server/rewardShopActions.test.js
          src/server/rewardShopAccess.test.js
          src/server/rewardChallengeCore.test.js
          src/server/rewardChallengeFacts.test.js
          src/server/rewardChallengeEngine.test.js
          src/server/rewardChallengeRevisionEngine.test.js
          src/server/rewardSurpriseCore.test.js
          src/server/rewardSurpriseChallengeEngine.test.js
          src/server/profileTaxonomyCore.test.js
          src/components/rewardShopGameView.test.js
      - name: Tracker source reconciliation tests
        run: >-
          node --experimental-loader ./scripts/testEsmLoader.mjs --test
          src/server/trackerSourceReconcileCore.test.js
          src/services/completionEvents.test.js
          src/utils/trackerDefaults.test.js
          src/utils/trackerMigration.test.js
          api/exercise-record-sync.test.js
      - name: Review settlement stability tests
        run: >-
          node --experimental-loader ./scripts/testEsmLoader.mjs --test
          src/review/reviewPointsAdapter.test.js
          src/review/reviewPointsStability.test.js
          src/review/reviewSettlementAudit.test.js
          src/review/PointsSettlementBar.test.js
          src/services/pointsApi.reviewIdempotency.test.js
      - name: Planner follow-through regressions
        run: >-
          node --experimental-loader ./scripts/testEsmLoader.mjs --test
          src/utils/plannerUiPolicy.test.js
          src/schedule/plannerTargetPersistence.test.js
          src/schedule/plannerFollowThrough.contract.test.js
          src/schedule/categoryMetadataPreservation.test.js
          src/schedule/focusCategoryTotals.test.js
          src/schedule/focusOverlap.test.js
      - name: Planner autonomy regressions
        run: >-
          node --experimental-loader ./scripts/testEsmLoader.mjs --test
          src/schedule/plannerPatchCardOps.test.js
          src/schedule/plannerPatchAutonomyIntegration.test.js
          src/schedule/plannerPatchTemplateIntegration.test.js
          src/schedule/plannerTemplateApply.test.js
          src/schedule/plannerDatePersistence.test.js
          src/schedule/studyTargetResolver.dailyDefault.test.js
          src/schedule/plannerDailyLifeCards.contract.test.js
          src/server/plannerLifeCardCompletion.test.js
          src/server/plannerAutonomyContext.test.js
          src/server/plannerTrackerStickerSync.test.js
          src/server/plannerQuickContext.test.js
          src/utils/plannerInbox.shared.test.js
          src/utils/timelineCardEdit.category.test.js
          src/agent/plannerNapReminder.test.js
          src/schedule/plannerAutonomyUi.contract.test.js
          api/planner-life-card.test.js
          api/planner-apply-revision-equivalence.test.js
          api/planner-direct-edit.test.js
          api/planner-reminder-plan.test.js
      - name: Production build
        run: pnpm build
