name: Shared ledger UI polish patch

on:
  push:
    branches:
      - feat/shared-ledger-ui-polish

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ledger-ui-patched]') && !contains(github.event.head_commit.message, '[ledger-ui-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-ledger-ui-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-shared-ledger-ui-polish.mjs
      - name: Build
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit patched App
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "feat: polish shared planner ledger UI [ledger-ui-patched]"
          git push origin HEAD:feat/shared-ledger-ui-polish
