name: Editable planner defaults patch

on:
  push:
    branches:
      - feat/shared-planner-ledger

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[defaults-patched]') && !contains(github.event.head_commit.message, '[defaults-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-planner-ledger
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-editable-planner-defaults.mjs
      - name: Build
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit patched App
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "feat: seed editable Snow-dust planner preferences [defaults-patched]"
          git push origin HEAD:feat/shared-planner-ledger
